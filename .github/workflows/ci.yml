name: CI

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Static Analysis
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cppcheck

      - name: Bootstrap vcpkg (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install --triplet x64-linux

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install cppcheck --no-progress -y
          'C:\Program Files\Cppcheck' >> $env:GITHUB_PATH

      - name: Bootstrap vcpkg (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install --triplet x64-mingw-static

      - name: Configure (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-14 -DENABLE_CPPCHECK=ON -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake

      - name: Build
        run: cmake --build build -j 8

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C Debug

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 gcc-14
          python3 -m pip install gcovr==8.6

      - name: Configure CMake with coverage
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DGCOV_EXECUTABLE=gcov-14 -DCMAKE_CXX_COMPILER=g++-14 -DENABLE_COVERAGE=ON

      - name: Run tests and generate coverage report
        run: cmake --build build --target coverage -j 8

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: build/coverage_html

  build-docs:
    name: Build Docs (Doxygen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Doxygen
        run: |
          set -x
          DOXY_VERSION=1.18.0
          RELEASE_TAG=Release_${DOXY_VERSION//./_}
          URL="https://github.com/doxygen/doxygen/releases/download/${RELEASE_TAG}/doxygen-${DOXY_VERSION}.linux.bin.tar.gz"
          wget -qO /tmp/doxygen.tar.gz "$URL"
          sudo mkdir -p /opt/doxygen
          sudo tar -C /opt/doxygen --strip-components=1 -xzf /tmp/doxygen.tar.gz
          sudo ln -sf /opt/doxygen/bin/doxygen /usr/local/bin/doxygen
          /usr/local/bin/doxygen --version
          
      - name : Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_DOXYGEN=ON

      - name: Build Doxygen target
        run: cmake --build build --target doxygen -j 8

      - name: Upload docs HTML
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: build/docs/html

  deploy-pages:
    name: Deploy Pages
    needs: [build, build-docs, test-coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: docs-html

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-html
          path: coverage-html

      - name: Assemble Pages site
        run: |
          set -e
          rm -rf site
          mkdir -p site/docs site/coverage
          if [ -d docs-html ]; then cp -r docs-html/* site/docs/; fi
          if [ -d coverage-html ]; then cp -r coverage-html/* site/coverage/; fi
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title>Project Pages</title></head>
          <body>
          <h1>Project Pages</h1>
          <ul>
            <li><a href="docs/index.html">Documentation (Doxygen)</a></li>
            <li><a href="coverage/index.html">Coverage Report</a></li>
          </ul>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
